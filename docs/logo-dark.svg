<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 512" width="1600" height="512">
  <svg x="0" y="0" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C4ED8"/>
      <stop offset="1" stop-color="#0EA5A0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C4ED8"/>
      <stop offset="1" stop-color="#0EA5A0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06223f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- slider tracks -->
  <g stroke-linecap="round" stroke-width="22">
    <line x1="112" y1="160" x2="400" y2="160" stroke="#ffffff" stroke-opacity="0.28"/>
    <line x1="112" y1="256" x2="400" y2="256" stroke="#ffffff" stroke-opacity="0.28"/>
    <line x1="112" y1="352" x2="400" y2="352" stroke="#ffffff" stroke-opacity="0.28"/>
    <!-- filled part up to each knob -->
    <line x1="112" y1="160" x2="336" y2="160" stroke="#ffffff" stroke-opacity="0.9"/>
    <line x1="112" y1="256" x2="176" y2="256" stroke="#ffffff" stroke-opacity="0.9"/>
    <line x1="112" y1="352" x2="336" y2="352" stroke="#ffffff" stroke-opacity="0.9"/>
  </g>
  <!-- mesh links between knobs: a zig-zag -->
  <polyline points="336,160 176,256 336,352" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="2 16" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- knobs / nodes -->
  <g filter="url(#shadow)">
    <circle cx="336" cy="160" r="40" fill="#ffffff"/>
    <circle cx="176" cy="256" r="40" fill="#ffffff"/>
    <circle cx="336" cy="352" r="40" fill="#ffffff"/>
  </g>
  <circle cx="336" cy="160" r="15" fill="url(#dot)"/>
  <circle cx="176" cy="256" r="15" fill="url(#dot)"/>
  <circle cx="336" cy="352" r="15" fill="url(#dot)"/>
</svg>
  <text x="576" y="250" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#f8fafc" letter-spacing="-3">ZHA</text>
  <text x="576" y="390" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="118" font-weight="500" fill="#94a3b8" letter-spacing="-1">Device Settings</text>
</svg>
