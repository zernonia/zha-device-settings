name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest version has release notes in CHANGELOG.md
        run: python3 tools/changelog_section.py --manifest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install zigpy pytest
          # zigbee.py only needs these two HA symbols; stub them so CI stays light.
          mkdir -p .stub/homeassistant
          touch .stub/homeassistant/__init__.py
          printf 'class HomeAssistant: pass\ndef callback(f): return f\n' > .stub/homeassistant/core.py
          printf 'class HomeAssistantError(Exception): pass\n' > .stub/homeassistant/exceptions.py
          PYTHONPATH=.stub pytest -q tests
