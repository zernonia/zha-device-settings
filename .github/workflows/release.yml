name: Release

# Bump "version" in custom_components/zha_device_settings/manifest.json, add a matching
# "## [x.y.z]" section to CHANGELOG.md, and push to main. If no tag exists for that version
# yet, this creates tag vX.Y.Z and a GitHub release whose notes are that CHANGELOG section.
# Home Assistant shows those notes in the update dialog. Releasing without notes fails.
# Editing an existing section in CHANGELOG.md also updates that release's notes.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/zha_device_settings/manifest.json"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(jq -r .version custom_components/zha_device_settings/manifest.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Create release if tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do"
            exit 0
          fi
          python3 tools/changelog_section.py "$VERSION" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Sync notes of existing releases from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            if python3 tools/changelog_section.py "$tag" > notes.md 2>/dev/null; then
              current=$(gh release view "$tag" --json body --jq .body)
              if [ "$current" != "$(cat notes.md)" ]; then
                gh release edit "$tag" --notes-file notes.md
                echo "Updated notes for $tag"
              fi
            fi
          done
