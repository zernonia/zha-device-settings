name: Release

# Bump "version" in custom_components/zha_device_settings/manifest.json and push to main.
# If no tag exists for that version yet, this creates tag vX.Y.Z and a GitHub release,
# which HACS shows as an available update in Home Assistant.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/zha_device_settings/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(jq -r .version custom_components/zha_device_settings/manifest.json)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Create release if tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
