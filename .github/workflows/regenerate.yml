name: Regenerate definitions

# Re-runs tools/generate.js against the latest zigbee-herdsman-converters and
# opens a PR when the generated definitions change.

on:
  schedule:
    - cron: "0 3 1 * *" # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh list of settings ZHA already exposes
        working-directory: tools
        run: |
          pip install zha
          python export_zha_builtins.py > zha_builtin_attributes.json

      - name: Generate from latest converters
        working-directory: tools
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --save-exact zigbee-herdsman-converters@latest
          node generate.js
          echo "ZHC_VERSION=$(node -p "require('zigbee-herdsman-converters/package.json').version")" >> "$GITHUB_ENV"

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- custom_components tools/package.json tools/zha_builtin_attributes.json; then
            echo "No changes"; exit 0
          fi
          branch="regenerate/zhc-$ZHC_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          python3 - <<PY
          import pathlib, re
          p = pathlib.Path("CHANGELOG.md"); s = p.read_text()
          line = "- Device definitions updated from Zigbee2MQTT's device library ($ZHC_VERSION). Review the diff for new devices and settings worth naming here."
          s = re.sub(r"(## \\[Unreleased\\]\n)", lambda m: m.group(1) + "\n### Changed\n" + line + "\n", s, count=1)
          p.write_text(s)
          PY
          git add CHANGELOG.md custom_components tools/package.json tools/package-lock.json tools/*.skipped.json tools/zha_builtin_attributes.json
          git commit -m "Regenerate definitions from zigbee-herdsman-converters $ZHC_VERSION"
          git push -f origin "$branch"
          gh pr create --title "Regenerate definitions (zigbee-herdsman-converters $ZHC_VERSION)" \
            --body "Automated regeneration. Review the definitions diff and reword the CHANGELOG entry under Unreleased (name notable new devices/settings). To release: move Unreleased into a versioned section and bump the manifest version." \
            --head "$branch" --base main || echo "PR already exists"
